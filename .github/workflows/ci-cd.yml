name: CI/CD
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.23]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: zenful_shopping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_DSN: host=localhost port=5432 user=user password=adminpassword dbname=zenful_shopping_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build -v ./...
      - name: Run go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Run migrations
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path=./cmd/migrate/migrations -database="postgres://user:adminpassword@localhost:5432/zenful_shopping_test?sslmode=disable" up
      - name: Run Tests
        run: go test -race ./...

  deploy:
    needs: build_and_test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create .env file
        run: |
          cat > .env << EOF
          ADDR=${{ secrets.ADDR }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_ADDR=${{ secrets.DB_ADDR }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TOKEN=${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_USERNAME=${{ secrets.GOOGLE_USERNAME }}
          FILE_STORAGE_PATH=${{ secrets.FILE_STORAGE_PATH }}
          EOF
      - name: Deploy with Docker Compose
        run: |
          docker compose build
          docker compose up -d
